<!doctype html>
<html lang="th">

<head>
  <link rel="icon" href="data:," />
  <meta charset="UTF-8" />
  <script>
    (() => {
      let user = {};

      try {
        user = JSON.parse(sessionStorage.getItem("userData") || "{}") || {};
      } catch {
        sessionStorage.removeItem("userData");
      }

      if (!user.token || !["teacher", "student"].includes(user.role)) {
        sessionStorage.removeItem("userData");
        location.replace("index.html");
        return;
      }

      if (user.role !== "teacher") {
        location.replace("student.html");
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style id="teacher-design-system">
    :root {
      --orange: #ff8a00;
      --orange-2: #ffb000;
      --gold: #ffd36a;
      --deep: #2d1b0b;
      --brown: #5d3b16;
      --soft: #fff8ea;
      --white: #ffffff;
      --glass: rgba(255, 255, 255, 0.76);
      --glass-strong: rgba(255, 255, 255, 0.88);
      --border: rgba(255, 255, 255, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Prompt", "Tahoma", sans-serif;
      color: var(--deep);
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 10%,
          rgba(255, 196, 81, 0.46),
          transparent 28%),
        radial-gradient(circle at 88% 78%,
          rgba(255, 138, 0, 0.32),
          transparent 31%),
        radial-gradient(circle at 50% 50%,
          rgba(255, 255, 255, 0.95),
          transparent 42%),
        linear-gradient(135deg, #fffaf0 0%, #ffe8bd 52%, #ffffff 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.32;
      background-image:
        linear-gradient(rgba(255, 138, 0, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 138, 0, 0.055) 1px, transparent 1px);
      background-size: 43.24px 43.24px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
      z-index: -3;
    }

    body::after {
      content: "";
      position: fixed;
      width: 488.8px;
      height: 488.8px;
      right: -169.2px;
      bottom: -169.2px;
      border-radius: 50%;
      background: radial-gradient(circle,
          rgba(255, 138, 0, 0.25),
          rgba(255, 179, 0, 0.12) 45%,
          transparent 70%);
      filter: blur(11.28px);
      animation: slowSpin 18s linear infinite;
      pointer-events: none;
      z-index: -2;
    }

    @keyframes slowSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .tech-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .tech {
      position: absolute;
      color: rgba(255, 138, 0, 0.12);
      font-weight: 600;
      white-space: nowrap;
      animation: floatTech 10s ease-in-out infinite;
    }

    .tech:nth-child(1) {
      top: 12%;
      left: 28%;
      font-size: 24.44px;
    }

    .tech:nth-child(2) {
      top: 25%;
      right: 8%;
      font-size: 18.8px;
      animation-delay: -3s;
    }

    .tech:nth-child(3) {
      bottom: 18%;
      left: 32%;
      font-size: 22.56px;
      animation-delay: -6s;
    }

    .tech:nth-child(4) {
      bottom: 8%;
      right: 22%;
      font-size: 16.92px;
      animation-delay: -2s;
    }

    .tech:nth-child(5) {
      top: 52%;
      left: 5%;
      font-size: 16.92px;
      animation-delay: -5s;
    }

    @keyframes floatTech {

      0%,
      100% {
        transform: translateY(0px) rotate(-2deg);

      50% {

    async function prepareAvatar(file) {
      if (!file) return;
      if (
        !["image/jpeg", "image/png", "image/webp"].includes(file.type) ||
        file.size > 5 * 1024 * 1024
      )
        throw Error("ใช้ JPG / PNG / WebP ขนาดไม่เกิน 5 MB");
      avatarLoading = true;
      try {
        const url = URL.createObjectURL(file),
          picture = new Image();
        try {
          await new Promise((resolve, reject) => {
            picture.onload = resolve;
            picture.onerror = () => reject(Error("เปิดรูปไม่ได้"));
            picture.src = url;
          });
        } finally {
          URL.revokeObjectURL(url);
        }
        avatarEditor = { picture, zoom: 1, x: 0, y: 0, angle: 0, flip: 1 };
        $("avatarPreview").innerHTML =
          `<div class="avatar-editor"><canvas id="avatarCanvas" width="256" height="256" aria-label="ลากภาพเพื่อจัดตำแหน่ง"></canvas><span class="crop-guide" aria-hidden="true"></span></div>`;
        $("avatarStatus").innerHTML =

        drawAvatar();
        const canvas = $("avatarCanvas");
        let pointer = null;
        canvas.addEventListener("pointerdown", (e) => {
          pointer = { x: e.clientX, y: e.clientY };
          canvas.setPointerCapture(e.pointerId);
        });
        canvas.addEventListener("pointermove", (e) => {
          if (!pointer) return;
          const scale = 256 / canvas.getBoundingClientRect().width;
          avatarEditor.x += (e.clientX - pointer.x) * scale;
          avatarEditor.y += (e.clientY - pointer.y) * scale;
          pointer = { x: e.clientX, y: e.clientY };
          drawAvatar();
        });
        canvas.addEventListener("pointerup", () => (pointer = null));
        canvas.addEventListener("pointercancel", () => (pointer = null));
      } finally {
        avatarLoading = false;
      }
    }
    function drawAvatar() {
      const e = avatarEditor,
        canvas = $("avatarCanvas");
      if (!e || !canvas) return;
      const ctx = canvas.getContext("2d"),
        p = e.picture,
        scale = (256 / Math.min(p.naturalWidth, p.naturalHeight)) * e.zoom;
      const rotated = e.angle % 180 !== 0,
        width = (rotated ? p.naturalHeight : p.naturalWidth) * scale,
        height = (rotated ? p.naturalWidth : p.naturalHeight) * scale;
      e.x = Math.max(-(width - 256) / 2, Math.min((width - 256) / 2, e.x));
      e.y = Math.max(-(height - 256) / 2, Math.min((height - 256) / 2, e.y));
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, 256, 256);
      ctx.save();
      ctx.translate(128 + e.x, 128 + e.y);
      ctx.rotate((e.angle * Math.PI) / 180);
      ctx.scale(e.flip * scale, scale);
      ctx.drawImage(p, -p.naturalWidth / 2, -p.naturalHeight / 2);
      ctx.restore();
      let data = canvas.toDataURL("image/webp", 0.82);
      if (data.length > 80000) data = canvas.toDataURL("image/jpeg", 0.65);
      if (data.length > 80000)
        throw Error("รูปใหญ่เกินกำหนด กรุณาเลือกรูปใหม่");

      };

    }

    const RETRY_READS = new Set([

    const pendingReads = new Map();

    function api(action, fields = {}) {
      if (!RETRY_READS.has(action)) return apiRequest(action, fields);
      const key = JSON.stringify([action, fields, session.token]);
      if (pendingReads.has(key)) return pendingReads.get(key);
      const request = apiRequest(action, fields).finally(() => {
        if (pendingReads.get(key) === request) pendingReads.delete(key);
      });
      pendingReads.set(key, request);
      return request;
    }
    async function apiRequest(action, fields = {}) {
      const apiStartedAt = Date.now();
      const traceId = crypto.randomUUID();
      const url = sessionStorage.getItem("kruvandaGasUrl") || "";
      if (
        !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)
      ) {
        const error = new Error("แท็บนี้ไม่มี URL ของ API ที่ถูกต้อง กรุณาตรวจการตั้งค่า URL ในหน้าล็อกอิน");
        Object.assign(error, { action, traceId, code: "INVALID_API_URL", stage: "ตรวจ URL ก่อนส่งคำขอ", at: new Date().toISOString(), elapsedMs: Date.now() - apiStartedAt, advice: "ตรวจ URL ในหน้าล็อกอินแล้วเข้าสู่ระบบใหม่" });
        throw error;
      }
      const attempts = RETRY_READS.has(action) ? 2 : 1;
      for (let attempt = 0; attempt < attempts; attempt++) {
        let stage = "ส่งคำขอและรับคำตอบจาก API";
        const controller = new AbortController();
        const requestTimeout = RETRY_READS.has(action)
          ? CONFIG.TIMEOUT_MS
          : 90000;
        const timer = setTimeout(() => controller.abort(), requestTimeout);
        try {
          const requestUrl = url + "?request=" + encodeURIComponent(crypto.randomUUID());
          const response = await fetch(requestUrl, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action, ...fields, token: session.token, traceId, attempt: attempt + 1 }),
            signal: controller.signal,
            redirect: "follow",
            cache: "no-store",
            keepalive: action === "logout",
          });
          if (!response.ok) {
            const redirected404 = response.status === 404 &&
              response.url.startsWith("https://script.googleusercontent.com/");
            const error = Error(
              redirected404
                ? "ปลายทางรับคำตอบของ Google ตอบกลับ 404 กรุณาลองโหลดข้อมูลใหม่"
                : response.status === 404
                  ? "ไม่พบปลายทาง API กรุณาตรวจ URL และ deployment"
                  : "เชื่อมต่อไม่สำเร็จ (" + response.status + ")",
            );
            error.httpStatus = response.status;
            error.code = redirected404 ? "RESPONSE_ENDPOINT_404" : "HTTP_ERROR";
            error.retryable = redirected404 ||
              [408, 429, 500, 502, 503, 504].includes(response.status);
            throw error;
          }
          stage = "อ่านคำตอบ JSON จาก API";
          let result;
          try {
            result = await response.json();
          } catch (parseError) {
            if (controller.signal.aborted || parseError.name === "AbortError")
              throw parseError;
            const error = Error(
              "ปลายทางไม่ได้ส่งข้อมูล API ตามที่คาดไว้ ลองโหลดอีกครั้ง หากยังเกิดซ้ำให้ตรวจ deployment และสิทธิ์เข้าถึง",
            );
            error.retryable = true;
            throw error;
          }
          if (result?.status === "success" && result.action && result.action !== action) {
            const error = Error("ได้รับคำตอบไม่ตรงกับคำขอ กรุณาลองโหลดใหม่");
            error.code = "RESPONSE_ACTION_MISMATCH";
            error.retryable = true;
            throw error;
          }
          if (!result || result.status !== "success") {
            const error = Error(
              (result && result.message) || "API ส่งข้อมูลไม่ถูกต้อง",
            );
            error.code = result?.code || "API_ERROR";
            error.stage = result?.diagnostics?.stage || "GAS ประมวลผลคำสั่ง";
            error.resource = result?.diagnostics?.resource || "";
            error.advice = result?.diagnostics?.advice || "";
            error.uncertain = result?.diagnostics?.outcome === "unknown";
            error.authRequired = result?.code === "AUTH_EXPIRED";
            error.retryable = result?.code === "SYSTEM_BUSY";
            if (error.authRequired)
              window.kruvandaSession?.expire(error.message);
            throw error;
          }
          stage = "ตรวจรูปแบบข้อมูลที่ GAS ส่งกลับ";
          const validators = {
            bootstrap: (d) => ["Groups", "Students", "Courses", "Offerings", "Enrollments"].every((k) => Array.isArray(d?.[k])),
            dashboard: (d) => !!d?.totals && !!d?.pending && Array.isArray(d.breakdown) && Array.isArray(d.followup),
            submissions: (d) => !!d?.counts && Number.isFinite(d.total) && Array.isArray(d.items) && Array.isArray(d.activities),
            progress: (d) => Array.isArray(d),
            courseData: (d) => ["Chapters", "Materials", "Activities"].every((k) => Array.isArray(d?.[k])),

        )}</div><div class="home-chart-grid">${overviewChart(t)}<section class="dash-panel home-comparison"><div class="dash-section-head"><h2>${homeCourse ? "การส่งงานแต่ละชั้นเรียน" : "การส่งงานรายวิชาและชั้นเรียน"}</h2>${button("ดูความก้าวหน้า", "dash-progress", homeCourse ? homeCourse + "|" + selectedGroup : "")}</div>${legend}${rows.length ? rows.map((b) => `<div class="dash-chart-row"><div><strong>${esc(b.courseName)}</strong><small>${esc(b.groupName)} · ${b.students} คน</small></div>${stacked(b)}<div class="home-row-total"><span>ส่งแล้ว ${b.submitted}/${b.expected} รายการ</span><strong>${Math.round((b.submitted / b.expected) * 100)}%</strong></div></div>`).join("") : empty(dashboardEmptyMessage(t))}</section></div><div class="home-review-shortcut"><div><strong>${!t.expected || !t.submitted ? dashboardEmptyMessage(t) : t.pending ? "มีงานรอการตรวจ " + t.pending + " รายการ" : "ไม่มีงานรอการตรวจในขณะนี้"}</strong></div>${t.expected ? button(t.submitted ? "เข้าสู่หน้าตรวจงาน" : "ดูความก้าวหน้า", t.submitted ? "dash-review" : "dash-progress", t.submitted ? "" : homeCourse ? homeCourse + "|" + selectedGroup : "", true) : ""}</div>`;
    }

    let startupDashboard = null;
    async function loadDashboard(version) {
      const courseId = homeCourse,
        groupId = selectedGroup,
        key = courseId + ":" + groupId;
      const target = $("content").querySelector(".dash-results");
      if (
        dashboardCache.has(key) &&
        target &&
        (!target.children.length ||
          target.querySelector(".dash-skeleton, .inline-load-indicator"))
      )
        target.innerHTML = dashboardResult(dashboardCache.get(key));
      try {
        const prefetched = startupDashboard;
        const summary = prefetched && prefetched.key === key &&
          prefetched.epoch === dataEpoch
          ? await prefetched.promise.then((r) => {
            if (r.error) throw r.error;
            return r.data;
          })
          : await api("dashboard", { courseId, groupId, forceRefresh: false });
        if (startupDashboard === prefetched) startupDashboard = null;
        if (version !== navVersion || currentPage !== "home") return;
        if (
          !summary?.totals ||
          !Array.isArray(summary.breakdown) ||
          !Array.isArray(summary.followup)
        )
          throw Error("กรุณาเผยแพร่ GAS ฉบับใหม่ให้ตรงกับหน้าครู");
        dashboardLoadedOnce = true;
        scheduleReadyPages();
        dashboardCache.set(key, summary);
        if (
          $("modal").open ||
          document.activeElement?.matches(
            "#content input, #content textarea, #content select",
          )
        ) {
          pageVersions.delete(pageCacheKey());
          return;
        }
        const updateSlot = document.querySelector(".dash-update-slot");
        if (updateSlot) updateSlot.textContent = updatedLabel(summary);
        if (target) {
          const html = dashboardResult(summary);
          if (target.innerHTML !== html) target.innerHTML = html;
          target.removeAttribute("aria-busy");
          pageCache.set(pageCacheKey(), $("content").innerHTML);
          pageVersions.set(pageCacheKey(), dataEpoch);
        }
      } catch (e) {
        if (version !== navVersion || currentPage !== "home") return;
        if (target) {
          target.removeAttribute("aria-busy");
          if (!dashboardCache.has(key)) target.innerHTML = "";
          target.insertAdjacentHTML(
            "afterbegin",
            `<div>${errorNotice(e)}${button("ลองอีกครั้ง", "retry-dashboard")}${e.authRequired ? button("เข้าสู่ระบบใหม่", "relogin") : ""}</div>`,
          );
        }
      }
      if (!profileReady && !baseStale && !profileRequest)
        loadProfile().catch(() => {
          $("who").textContent = session.fullName || "บัญชีของฉัน";
          $("who").title = $("who").textContent;
        });
    }

    function pageIntro(title, description, action = "") {
      return description || action
        ? `<section class="workspace-intro compact-intro" aria-label="${esc(title)}"><div><p>${esc(description)}</p></div>${action ? `<div class="actions">${action}</div>` : ""}</section>`
        : "";
    }
    function metricIcon(title) {
      const action = /อัตรา/.test(title)
        ? "metric-rate"
        : /รอแก้ไข|ส่งกลับ/.test(title)
          ? "metric-return"
          : /ยังไม่ส่ง/.test(title)
            ? "metric-missing"
            : /รอตรวจ/.test(title)
              ? "metric-clock"
              : /ตรวจแล้ว/.test(title)
                ? "metric-check"
                : /ส่งแล้ว/.test(title)
                  ? "metric-sent"
                  : /งาน/.test(title)
                    ? "metric-tasks"
                    : /นักเรียน|เข้ารายวิชา/.test(title)
                      ? "go-students"
                      : /ชั้นเรียน/.test(title)
                        ? "go-groups"
                        : "go-courses";
      return shortcutIcon(action);
    }
    function summaryStrip(items) {
      return `<div class="workspace-summary${items.length === 4 ? " summary-four" : ""}">${items
        .map(([title, value, hint]) => {
          const unit = /นักเรียน|เข้ารายวิชา/.test(title)
            ? "คน"
            : /ชั้นเรียน/.test(title)
              ? "ชั้นเรียน"
              : /รายวิชา|ใช้งานอยู่|ซ่อนและปิดใช้งาน/.test(title)
                ? "รายวิชา"
                : "รายการ";
          return `<div><span class="stat-symbol" aria-hidden="true">${metricIcon(title)}</span><span>${esc(title)}</span><strong>${esc(value)}<small>${unit}</small></strong>${hint ? `<p>${esc(hint)}</p>` : ""}</div>`;
        })
        .join("")}</div>`;
    }
    function studentAccess(s) {
      if (s.status !== "active") return "ปิดการเข้าใช้งาน";
      const room = db.Groups.find((g) => g.id === s.groupId);
      return !room
        ? "ยังไม่มีชั้นเรียน"
        : room.status === "inactive"
          ? "ห้องถูกปิดใช้งาน"
          : "เข้าใช้งานได้";
    }
    function syncWelcomeName() {
      const name = $("welcomeName");
      if (name)
        name.textContent =
          myProfile.fullName || session.fullName || "บัญชีครู";
    }
    function readableTables() {
      syncWelcomeName();
      document
        .querySelectorAll("#content .table-wrap table")
        .forEach((table) => {
          const labels = [...table.querySelectorAll("thead th")].map((th) =>
            th.textContent.trim(),
          );
          table.classList.add("responsive-table");
          table.querySelectorAll("tbody tr").forEach((row) =>
            [...row.children].forEach((cell, i) => {
              cell.dataset.label = labels[i] || "";
            }),
          );
        });
    }
    const workspaceSearch = { course: "", room: "" };
    function filterWorkspaceCards(input) {
      const kind = input.id === "courseSearch" ? "course" : "room";
      const query = input.value.trim().toLocaleLowerCase("th");
      const cards = [
        ...document.querySelectorAll(`[data-search-kind="${kind}"]`),
      ];
      workspaceSearch[kind] = input.value;
      let visible = 0;
      cards.forEach((card) => {
        card.hidden = !card.dataset.searchText
          .toLocaleLowerCase("th")
          .includes(query);
        if (!card.hidden) visible++;
      });
      const result = document.getElementById(kind + "SearchResult");
      if (result)
        result.textContent = `แสดง ${visible} จาก ${cards.length} ${kind === "course" ? "รายวิชา" : "ชั้นเรียน"}`;
      let message = document.getElementById(kind + "SearchEmpty");
      if (!message) {
        message = document.createElement("p");
        message.id = kind + "SearchEmpty";
        message.className = "empty";
        message.setAttribute("role", "status");
        input.closest(".workspace-search").after(message);
      }
      message.hidden = visible > 0 || !query;
      message.textContent = `ไม่พบ${kind === "course" ? "รายวิชา" : "ชั้นเรียน"}ที่ตรงกับ “${input.value.trim()}”`;
    }
    function courseCard(c) {
      const offers = new Set(
        db.Offerings.filter(
          (o) => o.courseId === c.id && o.status === "active",
        ).map((o) => o.id),
      );
      const en = db.Enrollments.filter(
        (e) => offers.has(e.offeringId) && e.status === "active",
      );
      const names = [
        ...new Set(
          en.map((e) =>
            groupName(
              db.Students.find((s) => s.id === e.studentId)?.groupId ||
              e.groupId,
            ),
          ),
        ),
      ].sort((a, b) => a.localeCompare(b, "th", { numeric: true }));
      const classList = (list) =>
        list
          .map((name) => `<span>${esc(name)}</span>`)
          .join(
            '<span class="course-class-separator" aria-hidden="true">·</span>',
          );
      const classrooms = names.length
        ? `<div class="course-classes"><span class="course-classes-label">ชั้นเรียนที่เรียน</span><div class="course-classes-list">${classList(names.slice(0, 3))}</div>${names.length > 3 ? `<details class="course-classes-more"><summary>ดูทั้งหมด (${names.length} ชั้นเรียน)</summary><div class="course-classes-list">${classList(names.slice(3))}</div></details>` : ""}</div>`
        : '<div class="course-classes course-classes-empty">ยังไม่ได้เพิ่มนักเรียนเข้ารายวิชา</div>';
      return `<article class="card course-card" data-course-status="${esc(c.status)}" data-search-kind="course" data-search-text="${esc(c.code + " " + c.name)}"><div class="toolbar course-card-header"><span class="course-code">${esc(c.code)}</span>${badge(c.status)}</div><div class="course-emblem">${shortcutIcon("go-courses")}</div><h3>${esc(c.name)}</h3>${classrooms}<div class="actions">${button("เข้าสู่รายวิชา", "open-course", c.id, true)}<details class="more-menu"><summary>จัดการรายวิชา ▾</summary><div>${button("แก้ไขรายวิชา", "edit-course", c.id)}${button("ลบรายวิชา", "delete-entity", "course|" + c.id)}</div></details></div></article>`;
    }

    const listOrder = {
      courses: "newest",
      groups: "newest",
      students: "newest",
      review: "newest",
    };
    function orderedRows(rows, page) {
      return listOrder[page] === "newest"
        ? rows.slice().reverse()
        : rows.slice();
    }
    function orderButton(page) {
      const newest = listOrder[page] === "newest";
      return `<span class="order-description">เรียงตามลำดับเพิ่มข้อมูล</span><button type="button" class="btn order-toggle" data-action="toggle-order" data-id="${page}" title="${newest ? "กดเพื่อเรียงรายการเก่าสุดก่อน" : "กดเพื่อเรียงรายการล่าสุดก่อน"}" aria-label="${newest ? "เรียงล่าสุดก่อน กดเพื่อเรียงเก่าสุดก่อน" : "เรียงเก่าสุดก่อน กดเพื่อเรียงล่าสุดก่อน"}"><span aria-hidden="true">${newest ? "↓" : "↑"}</span> ${newest ? "ล่าสุดก่อน" : "เก่าสุดก่อน"}</button>`;
    }
    function coursesView() {
      const active = db.Courses.filter((c) => c.status === "active").length;
      return (
        pageIntro(
          "รายวิชาและบทเรียน",
          "จัดการบทเรียน กิจกรรม และนักเรียนในแต่ละรายวิชา",
          button("＋ สร้างรายวิชา", "new-course", "", true),
        ) +
        summaryStrip([
          ["รายวิชาทั้งหมด", db.Courses.length, ""],
          ["ใช้งานอยู่", active, ""],
          ["ซ่อนและปิดใช้งาน", db.Courses.length - active, ""],
        ]) +
        `<div class="workspace-search centered-search course-search"><label>ค้นหารายวิชา<input id="courseSearch" value="${esc(workspaceSearch.course)}" placeholder="พิมพ์ชื่อหรือรหัสวิชา"></label></div><div class="list-order-bar">${orderButton("courses")}</div>${[
          [true, "รายวิชาที่ใช้งานอยู่"],
          [false, "รายวิชาที่ซ่อนและปิดใช้งาน"],
        ]
          .map(([on, title]) => {
            const list = orderedRows(
              db.Courses.filter((c) => (c.status === "active") === on),
              "courses",
            );
            return on || list.length
              ? `<section class="workspace-section"><h2>${title} <span class="badge">${list.length} รายวิชา</span></h2><div class="course-grid">${list.map(courseCard).join("") || empty("ยังไม่มีรายวิชา")}</div></section>`
              : "";
          })
          .join("")}`
      );
    }

    function groupsView() {
      const active = db.Groups.filter((g) => g.status !== "inactive"),
        inactive = db.Groups.filter((g) => g.status === "inactive");
      const cards = (list) =>
        orderedRows(list, "groups")
          .map((g) => {
            const courseIds = new Set(
              db.Enrollments.filter(
                (e) =>
                  db.Students.some(
                    (s) => s.id === e.studentId && s.groupId === g.id,
                  ) && e.status === "active",
              )
                .map(
                  (e) =>
                    db.Offerings.find(
                      (o) => o.id === e.offeringId && o.status === "active",
                    )?.courseId,
                )
                .filter(Boolean),
            );
            const courses = db.Courses.filter(
              (c) => courseIds.has(c.id) && c.status === "active",
            );
            return `<article class="card room-card" data-search-kind="room" data-search-text="${esc(g.name)}"><div class="dash-section-head"><h3>${esc(g.name)}</h3>${badge(g.status === "inactive" ? "inactive" : "active")}</div><div class="room-count"><strong>${db.Students.filter((s) => s.groupId === g.id).length}</strong> คน</div><p class="subtle">รายวิชาที่ใช้: ${courses.length ? courses.map((c) => esc(c.name)).join(" · ") : "ยังไม่ได้เพิ่มเข้ารายวิชา"}</p><div class="actions">${button("ดูรายชื่อนักเรียน", "group-students", g.id, true)}<details class="more-menu"><summary>จัดการชั้นเรียน ▾</summary><div>${button("แก้ไขชั้นเรียน", "edit-group", g.id)}${g.status !== "inactive" ? button("เปลี่ยนรายชื่อนักเรียนทั้งหมดในชั้น", "replace-roster", g.id) : ""}${button(g.status === "inactive" ? "เปิดใช้งานชั้นเรียนนี้" : "ปิดใช้งานชั้นเรียนนี้", "toggle-group", g.id)}${button("ลบชั้นเรียนออก", "delete-group", g.id)}</div></details></div></article>`;
          })
          .join("");
      return (
        pageIntro(
          "ชั้นเรียน",
          "จัดการชั้นเรียนและสมาชิกในแต่ละชั้นเรียน",
          button("＋ เพิ่มชั้นเรียน", "new-group", "", true),
        ) +
        summaryStrip([
          ["ชั้นเรียนทั้งหมด", db.Groups.length, ""],
          ["ชั้นเรียนที่ใช้งานอยู่", active.length, ""],
          ["ชั้นเรียนที่ซ่อนและปิดใช้งาน", inactive.length, ""],
        ]) +
        `<div class="workspace-search centered-search"><label>ค้นหาชั้นเรียน<input id="roomSearch" value="${esc(workspaceSearch.room)}" placeholder="เช่น ม.2/1"></label></div><div class="list-order-bar">${orderButton("groups")}</div><h2>ชั้นเรียนที่ใช้งานอยู่</h2><div class="class-grid">${cards(active) || empty("ยังไม่มีชั้นเรียน")}</div>${inactive.length ? `<h2>ชั้นเรียนที่ซ่อนและปิดใช้งาน</h2><div class="class-grid">${cards(inactive)}</div>` : ""}`
      );
    }

    let studentSearch = "";
    function presenceBadge(id) {
      const info = db.Presence?.items?.find((item) => item.studentId === id);
      let state = info?.status || "unknown";
      if (state === "unknown") return "";
      if (
        baseStale ||
        (state === "online" &&
          Date.now() -
          (db.Presence.receivedAt || Date.now()) +
          Number(db.Presence.serverNow) -
          Number(info.lastSeenAt) >=
          120000)
      )
        state = "offline";
      const label =
        {
          online: "กำลังใช้งาน",
          offline: "ออฟไลน์",
          never: "ไม่เคยเข้าใช้งาน",
          unknown: "",
        }[state] || "-";
      const date = Number(info?.lastLoginAt);
      const hint =
        state === "unknown"
          ? "บัญชีเดิมไม่มีประวัติการเข้าใช้งานให้ตรวจสอบ"
          : date
            ? "เข้าสู่ระบบล่าสุด " + new Date(date).toLocaleString("th-TH")
            : state === "never"
              ? "ยังไม่เคยเข้าสู่ระบบตั้งแต่สร้างบัญชี"
              : "มีประวัติใช้งาน แต่ไม่มีเวลาเข้าสู่ระบบล่าสุด";

      return `<span class="presence-badge ${esc(state)}" title="${esc(hint)}">${label}</span>`;
    }
    function studentsView() {
      const rows = orderedRows(
        db.Students.filter(
          (s) => !selectedGroup || s.groupId === selectedGroup,
        ),
        "students",
      );
      const studentCourses = new Map();
      const activeOffers = new Map(
        db.Offerings.filter((o) => o.status === "active").map((o) => [
          o.id,
          o.courseId,
        ]),
      );
      const activeCourses = new Map(
        db.Courses.filter((c) => c.status === "active").map((c) => [
          c.id,
          c.name,
        ]),
      );
      db.Enrollments.filter((e) => e.status === "active").forEach((e) => {
        const courseId = activeOffers.get(e.offeringId);
        if (!activeCourses.has(courseId)) return;
        if (!studentCourses.has(e.studentId))
          studentCourses.set(e.studentId, new Set());
        studentCourses.get(e.studentId).add(activeCourses.get(courseId));
      });
      const enrolled = (s) =>
        db.Enrollments.some(
          (e) =>
            e.studentId === s.id &&
            e.status === "active" &&
            db.Offerings.some(
              (o) =>
                o.id === e.offeringId &&
                o.status === "active" &&
                db.Courses.some(
                  (c) => c.id === o.courseId && c.status === "active",
                ),
            ),
        );
      return (
        pageIntro(
          "นักเรียน",
          "จัดการนักเรียนและบัญชีผู้เข้าใช้งานระบบ",
          button("＋ เพิ่มนักเรียน", "add-students-menu", "", true),
        ) +
        summaryStrip([
          [
            selectedGroup ? "นักเรียนในชั้นเรียนนี้" : "จำนวนนักเรียนทั้งหมด",
            rows.length,
            selectedGroup ? groupName(selectedGroup) : "ทุกชั้นเรียน",
          ],
          [
            "เพิ่มเข้ารายวิชาแล้ว",
            rows.filter(enrolled).length,
            "รายวิชาที่ใช้งานอยู่",
          ],
          [
            "ยังไม่ได้เพิ่มเข้ารายวิชา",
            rows.filter((s) => !enrolled(s)).length,
            "",

    function invalidateData() {
      dataEpoch++;
      dataCache.clear();
      dataTimes.clear();
      dataRequests.clear();
    }

    async function cachedData(action, fields, forceRefresh = false) {
      const key = action + JSON.stringify(fields);
      if (dataCache.has(key) && !forceRefresh) return dataCache.get(key);
      if (!dataRequests.has(key)) {
        const epoch = dataEpoch;
        const request = api(
          action,
          forceRefresh ? { ...fields, forceRefresh: true } : fields,
        )
          .then((data) => {
            if (epoch === dataEpoch) {
              dataCache.set(key, data);
              dataTimes.set(key, Date.now());
            }
            return data;
          })
          .finally(() => {
            if (dataRequests.get(key) === request) dataRequests.delete(key);
          });
        dataRequests.set(key, request);
      }
      return dataRequests.get(key);
    }

    function progressRows(all) {

          (r) =>
            (!progressSearch ||
              r.name
                .toLocaleLowerCase("th")
                .includes(progressSearch.toLocaleLowerCase("th"))) &&
            (progressStatus === "all" ||
              (progressStatus === "missing" && r.missing > 0) ||
              (progressStatus === "returned" && r.returned > 0) ||
              (progressStatus === "complete" &&
                r.expected > 0 &&
                r.submitted >= r.expected)),
        )
        .sort(
          (a, b) =>
            b.missing - a.missing ||
            b.returned - a.returned ||
            a.name.localeCompare(b.name, "th"),
        );

      const sums = all.reduce(
        (n, r) => ({
          expected: n.expected + r.expected,
          submitted: n.submitted + r.submitted,
          missing: n.missing + r.missing,
          returned: n.returned + r.returned,
        }),
        { expected: 0, submitted: 0, missing: 0, returned: 0 },

        return {
          id,
          list,
          expected: list.reduce((n, r) => n + r.expected, 0),
          submitted: list.reduce((n, r) => n + r.submitted, 0),
          returned: list.reduce((n, r) => n + r.returned, 0),

    document.addEventListener("change", async (event) => {

        return;
      const selectEl = el.form.elements.activityId;
      if (!selectEl) return;
      const version = ++adminActivityVersion;
      selectEl.disabled = true;
      selectEl.innerHTML = '<option value="">ทุกกิจกรรม</option>';
      if (!el.value) return;
      try {
        const data = await cachedData("courseData", { courseId: el.value });
        if (version !== adminActivityVersion || !selectEl.isConnected) return;
        selectEl.innerHTML += data.Activities.map(
          (a) => `<option value="${esc(a.id)}">${esc(a.title)}</option>`,
        ).join("");
        selectEl.disabled = false;
      } catch (error) {
        if (selectEl.isConnected) toast(error.message);
      }

    function validateQuestions(questions, mode) {
      if (!questions.length) throw Error("เพิ่มคำถามอย่างน้อยหนึ่งข้อ");
      questions.forEach((q, i) => {
        if (
          !q.text.trim() ||
          !Number.isFinite(q.points) ||
          q.points <= 0 ||
          q.points > 100
        )
          throw Error("ตรวจโจทย์และคะแนนข้อ " + (i + 1));
        if (
          q.type !== "text" &&
          (q.options.length < 2 ||
            q.options.length > 10 ||
            !Number.isInteger(q.correct) ||
            q.correct < 0 ||
            q.correct >= q.options.length)
        )
          throw Error("ตรวจตัวเลือกและเฉลยข้อ " + (i + 1));
        if (mode === "game" && q.type === "text")
          throw Error("เกมตอบคำถามใช้ช้อยส์หรือใช่–ไม่ใช่เท่านั้น");
      });
    }
    function parseName(raw) {
      raw = raw.normalize("NFC").trim().replace(/\s+/g, " ");
      const match = raw.match(
        /^(นางสาว|เด็กชาย|เด็กหญิง|น\s*\.?\s*ส\s*\.?|ด\s*\.?\s*ช\s*\.?|ด\s*\.?\s*ญ\s*\.?|นาย|นาง)\s*/,
      );
      const token = match ? match[1].replace(/[.\s]/g, "") : "";
      const prefix =
        { นส: "นางสาว", ดช: "เด็กชาย", ดญ: "เด็กหญิง" }[token] || token;
      const parts = (match ? raw.slice(match[0].length) : raw)
        .trim()
        .split(" ");
      return {
        prefix,
        firstName: parts[0] || "",
        lastName: parts.slice(1).join(" "),
      };
    }

    function stablePayload(value) {
      if (Array.isArray(value)) return value.map(stablePayload);
      if (value && typeof value === "object")
        return Object.fromEntries(
          Object.keys(value)
            .filter((k) => k !== "requestId")
            .sort()
            .map((k) => [k, stablePayload(value[k])]),
        );
      return value;
    }
    function mutationRequestId(action, fields) {
      const key = JSON.stringify([action, stablePayload(fields)]);
      if (!mutationRequests.has(key)) {
        mutationRequests.set(key, uid("REQ"));
        saveMutationRequests();
      }
      return { key, id: mutationRequests.get(key) };
    }
    function applyMutationSync(sync) {
      const allowed = [
        "Groups",
        "Students",
        "Courses",
        "Offerings",
        "Enrollments",
      ];
      if (
        !sync ||
        !sync.tables ||
        typeof sync.maintenance !== "boolean" ||
        !Object.keys(sync.tables).every(
          (key) => allowed.includes(key) && Array.isArray(sync.tables[key]),
        )
      )
        return false;
      baseVersion++;
      Object.assign(db, sync.tables);
      db.Settings = { ...db.Settings, maintenance: sync.maintenance };
      baseReady = true;
      baseStale = false;
      try {
        sessionStorage.setItem(
          "kruvandaBaseSnapshot",
          JSON.stringify({
            token: session.token,
            url: sessionStorage.getItem("kruvandaGasUrl"),
            at: Date.now(),
            data: db,
          }),
        );

      return true;

    function invalidateMutationData(action, fields) {
      const adminReads = [
        "adminOverview",

        "adminManagePreview",
        "adminUndoPreview",
        "adminRestorePreview",
        "deleteImpact",
        "groupImpact",
        "studentsBatchPreview",
        "replaceRosterPreview",
      ];
      let pages,
        reads,
        clearDashboard = false;
      if (
        ["backup", "adminPurge", "resetPassword", "setMaintenance"].includes(
          action,
        ) ||
        (action === "adminManage" && fields.target === "sessions")
      ) {
        pages = new Set(["settings"]);
        reads = new Set(adminReads);
        if (action !== "backup" && action !== "adminPurge") {
          pages.add("students");
          delete db.Presence;
        }
      } else if (
        [
          "grade",
          "returnWork",
          "saveChapter",

        ].includes(action) ||
        (action === "setStatus" &&

        pages = new Set(["home", "review", "progress", "course", "settings"]);

          "submissions",
          "submission",
          "submissionHistory",
          "progress",
        ]);
        clearDashboard = true;
      } else if (
        [

          "replaceRoster",
          "studentsBatch",
          "promote",
          "saveCourse",
          "saveOffering",
          "ensureOffering",

        (action === "setStatus" &&
          [
            "Groups",
            "Students",
            "Courses",
            "Offerings",
            "Enrollments",
          ].includes(fields.entity))
      ) {
        pages = new Set([
          "home",
          "courses",
          "groups",
          "students",
          "course",
          "review",
          "progress",
          "settings",
        ]);
        reads = new Set([
          ...adminReads,
          "submissions",
          "submission",
          "submissionHistory",
          "progress",

        clearDashboard = true;
        delete db.Presence;
      } else {
        dashboardCache.clear();
        invalidateData();

        delete db.Presence;

      dataEpoch++;
      dataRequests.clear();
      for (const key of dataCache.keys()) {

      for (const key of pageVersions.keys()) {

    async function runMutation(action, fields) {

        throw Error("กำลังแสดงข้อมูลเดิม กรุณารีเฟรชข้อมูลล่าสุดก่อนแก้ไข");

      ++navVersion;
      const lockedButtons = [
        ...document.querySelectorAll(
          "button[type=submit],#modal [data-action]",
        ),
      ].map((button) => [button, button.disabled]);
      const submitButtons = [
        ...document.querySelectorAll('#modal button[type="submit"]'),
      ];
      const buttonLabels = submitButtons.map((button) => button.textContent);
      submitButtons.forEach((button) => {
        button.textContent = "กำลังบันทึก…";
        button.setAttribute("aria-busy", "true");

      document
        .querySelectorAll("button[type=submit],#modal [data-action]")

          ["adminUndo", "adminRestore"].includes(action)

            : action === "deleteGroup"
              ? "กำลังสำรองข้อมูลและลบ…"
              : action === "backup"
                ? "กำลังสำรองข้อมูล…"
                : "กำลังบันทึกข้อมูล…",
        );
        const request = mutationRequestId(action, fields);
        const result = await api(action, {
          ...fields,
          requestId: request.id,
        });
        mutationRequests.delete(request.key);
        saveMutationRequests();
        modalDirty = false;
        $("modal").close();
        const sync = mutationSyncResponses.get(request.id);
        mutationSyncResponses.delete(request.id);
        const synchronized = applyMutationSync(sync);
        invalidateMutationData(action, fields);
        toast(
          ["adminUndo", "adminRestore"].includes(action)
            ? "คืนค่าข้อมูลสำเร็จ"
            : action === "backup"
              ? "สำรองข้อมูลสำเร็จ"
              : action === "deleteGroup"
                ? "ลบข้อมูลและเก็บข้อมูลกู้คืนแล้ว"
                : "บันทึกข้อมูลสำเร็จ",
        );
        try {
          if (!synchronized) {
            if (baseRequest) await baseRequest.catch(() => { });
            await refreshBase(true);
            dashboardCache.clear();
            invalidateData();
            pageVersions.clear();
            adminSummary = null;
          }
          $("message").innerHTML = "";
        } catch (e) {
          baseStale = true;
          $("message").innerHTML =
            `<div class="notice" role="status">บันทึกสำเร็จแล้ว แต่โหลดข้อมูลล่าสุดไม่สำเร็จ กรุณาอัปเดตข้อมูลก่อนแก้ไขต่อ ${button("อัปเดตข้อมูล", "refresh")}</div>`;
        }

      } catch (e) {
        if (e.code === "ACTION_REJECTED") {
          mutationRequests.delete(mutationRequestId(action, fields).key);

        toast(e.message || "บันทึกไม่สำเร็จ");

        busy = false;
        lockedButtons.forEach(([button, disabled]) => {
          if (button.isConnected) button.disabled = disabled;
        });
        submitButtons.forEach((button, i) => {
          button.textContent = buttonLabels[i];
          button.removeAttribute("aria-busy");

    let presencePending = false;

    (() => {
      let user;
      try {
        user = JSON.parse(sessionStorage.getItem("userData") || "{}");
      } catch {
        user = {};
      }
      if (!user.token || !["teacher", "student"].includes(user.role)) {
        location.replace("index.html");
        return;
      }
      let leaving = false,
        pending = false,
        lastSent = 0,
        queued = 0;
      const idleMs = user.role === "student" ? 900000 : 3600000;
      const url = sessionStorage.getItem("kruvandaGasUrl") || "";
      const stateKey = "kruvandaActivity";
      let state;
      try {
        state = JSON.parse(sessionStorage.getItem(stateKey) || "{}");
      } catch {
        state = {};
      }
      let lastActive = state.token === user.token ? Number(state.at) : 0;
      if (!lastActive)
        lastActive =
          Date.now() -
          Math.max(
            0,
            Number(user.serverNow || 0) +
            idleMs -
            Number(user.expiresAt || 0),
          );
      let deadline = lastActive + idleMs;
      let warning;
      function clearLogin(reason) {
        if (leaving) return;
        leaving = true;
        clearTimeout(queued);
        const token = user.token;
        sessionStorage.removeItem("userData");
        sessionStorage.removeItem(stateKey);
        sessionStorage.removeItem("kruvandaBaseSnapshot");
        sessionStorage.removeItem("kruvandaMutationRequests");
        sessionStorage.setItem(
          "kruvandaLoginNotice",
          reason || "เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่",
        );
        if (warning) warning.remove();
        document.documentElement.style.visibility = "hidden";
        if (
          /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)
        ) {
          fetch(url, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "logout", token }),
            keepalive: true,
          }).catch(() => { });
        }
        location.replace("index.html");
      }
      window.kruvandaSession = { expire: clearLogin };
      if (user.sessionPolicy !== "idle-v1") {
        clearLogin(
          "ระบบปรับการหมดอายุเมื่อไม่ได้ใช้งาน กรุณาเข้าสู่ระบบใหม่หนึ่งครั้ง",
        );
        return;
      }
      function saveActivity() {
        sessionStorage.setItem(
          stateKey,
          JSON.stringify({ token: user.token, at: lastActive }),
        );
      }
      function warningView(remaining) {
        if (!warning) {
          warning = document.createElement("div");
          warning.setAttribute("role", "alert");
          warning.style.cssText =
            "position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));z-index:100000;background:#fff5e5;color:#603a24;border:1px solid #daa66d;border-radius:16px;padding:18px;box-shadow:0 8px 30px #0002;font:14px/1.6 Tahoma,sans-serif;text-align:center";
          warning.innerHTML =
            '<strong>ใกล้หมดเวลาเข้าใช้งาน</strong><p data-idle-count></p><p>หากกำลังกรอกข้อมูล ให้บันทึกก่อนออกจากระบบ</p><button type="button" style="padding:10px 20px;border:0;border-radius:10px;background:#a84d20;color:white;font:inherit">ใช้งานต่อ</button>';
          warning
            .querySelector("button")
            .addEventListener("click", (e) => activity(e, true));
          document.body.appendChild(warning);
        }
        warning.querySelector("[data-idle-count]").textContent =
          `ไม่ได้ใช้งานต่อเนื่อง ระบบจะกลับหน้าเข้าสู่ระบบใน ${Math.max(1, Math.ceil(remaining / 1000))} วินาที`;
      }
      function tick() {
        if (leaving) return;
        const remaining =
          Math.min(deadline, lastActive + idleMs) - Date.now();
        if (remaining <= 0) {
          clearLogin("ออกจากระบบเพราะไม่มีการใช้งานนาน กรุณาเข้าสู่ระบบใหม่");
          return;
        }
        if (!document.hidden && remaining <= 60000) warningView(remaining);
      }
      async function request(action) {
        if (
          leaving ||
          pending ||
          !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)
        )
          return;
        pending = true;
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 20000);
        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action, token: user.token }),
            signal: controller.signal,
          });
          if (!response.ok) return;
          const result = await response.json();
          if (result.code === "AUTH_EXPIRED") {
            clearLogin(result.message);
            return;
          }
          if (result.status !== "success" || !result.data?.expiresAt) return;
          deadline =
            Date.now() +
            Math.max(
              0,
              Number(result.data.expiresAt) - Number(result.data.serverNow),
            );
          user.expiresAt = result.data.expiresAt;
          user.serverNow = result.data.serverNow;
          if (!leaving) {
            let current = {};
            try {
              current = JSON.parse(
                sessionStorage.getItem("userData") || "{}",
              );
            } catch (_) { }
            if (current.token === user.token)
              sessionStorage.setItem(
                "userData",
                JSON.stringify({
                  ...current,
                  expiresAt: user.expiresAt,
                  serverNow: user.serverNow,
                }),
              );
          }
        } catch (_) {
        } finally {
          clearTimeout(timeout);
          pending = false;
          tick();
        }
      }
      function sendActivity() {
        queued = 0;
        if (leaving || document.hidden || Date.now() - lastActive >= idleMs)
          return;
        if (pending) {
          queued = setTimeout(sendActivity, 1000);
          return;
        }
        lastSent = Date.now();
        request("sessionTouch");
      }
      function activity(event, immediate = false) {
        if (!event.isTrusted || leaving || document.hidden) return;
        if (Date.now() >= Math.min(deadline, lastActive + idleMs)) {
          tick();
          return;
        }

        saveActivity();
        if (warning) {
          warning.remove();
          warning = null;
        }

          clearTimeout(queued);

    (() => {
      let frame;

        ".dash-stat>span,.dash-stat>strong,.overview-metric>span,.overview-metric>strong,.workspace-summary>div>span,.workspace-summary strong,.overview-insights span,.overview-insights strong";
      function fitLabels() {
        const mobile = window.matchMedia("(max-width:900px)").matches;
        document.querySelectorAll(selector).forEach((el) => {
          if (!el.dataset.mobileFit) {
            el.dataset.mobileFit = "true";

          }
          el.style.fontSize = el.dataset.originalFont;
          if (!mobile || !el.clientWidth) return;
          let size = parseFloat(getComputedStyle(el).fontSize);
          const min = el.matches("strong") ? 20 : 11;
          while (el.scrollWidth > el.clientWidth + 1 && size > min) {
            size = Math.max(min, size - 0.5);
            el.style.fontSize = size + "px";

    (() => {
      let active = null;
      let frame = 0;
      function closeMenu(restoreFocus = false) {
        if (!active) return;
        const { details, panel, trigger } = active;
        active = null;

        if (!active) return;
        const { details, panel, trigger } = active;
        if (!details.isConnected || !details.open) {
          closeMenu();
          return;
        }
        const viewport = window.visualViewport;
        const leftEdge = viewport ? viewport.offsetLeft : 0;
        const topEdge = viewport ? viewport.offsetTop : 0;
        const width = viewport ? viewport.width : window.innerWidth;
        const height = viewport ? viewport.height : window.innerHeight;
        const rect = trigger.getBoundingClientRect();
        if (rect.bottom < topEdge || rect.top > topEdge + height) {
          closeMenu();
          return;
        }
        const gap = 8,
          pad = 12;
        panel.style.maxWidth = Math.max(0, width - pad * 2) + "px";
        panel.style.maxHeight = Math.max(0, height - pad * 2) + "px";
        const naturalHeight = panel.getBoundingClientRect().height;
        const below = Math.max(0, topEdge + height - rect.bottom - gap - pad);
        const above = Math.max(0, rect.top - topEdge - gap - pad);
        const up = naturalHeight > below && above > below;
        panel.style.maxHeight = (up ? above : below) + "px";
        const size = panel.getBoundingClientRect();
        const left = Math.max(
          leftEdge + pad,
          Math.min(
            rect.right - size.width,
            leftEdge + width - size.width - pad,
          ),
        );
        const top = up ? rect.top - gap - size.height : rect.bottom + gap;
        panel.style.left = left + "px";
        panel.style.top = Math.max(topEdge + pad, top) + "px";

        }

      }
      document.addEventListener(
        "toggle",
        (event) => {
          const details = event.target;
          if (
            !(details instanceof HTMLDetailsElement) ||
            !details.classList.contains("more-menu")

          if (details.open) openMenu(details);
          else if (active && active.details === details) closeMenu();
        },
        true,
      );
      document.addEventListener(
        "pointerdown",
        (event) => {
          if (active && !active.details.contains(event.target)) closeMenu();
        },
        true,
      );
      document.addEventListener(
        "keydown",
        (event) => {
          if (event.key === "Escape" && active) {
            event.preventDefault();
            event.stopPropagation();
            closeMenu(true);
          }
        },
        true,
      );
      document.addEventListener(
        "click",
        (event) => {
          if (
            active &&
            event.target.closest("[data-action]") &&
            active.panel.contains(event.target)
          )
            closeMenu();
        },
        true,
      );
      document.addEventListener("scroll", queuePosition, true);
      window.addEventListener("resize", queuePosition);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", queuePosition);
        window.visualViewport.addEventListener("scroll", queuePosition);
      }
      new MutationObserver(() => {
        if (active && !active.details.isConnected) closeMenu();
      }).observe(document.body, { childList: true, subtree: true });
    })();

  <script>
    (() => {
      const more = document.getElementById("mobileMore");
      const menu = document.getElementById("mobileMenuDialog");
      const sync = () => {
        const selected =
          document.querySelector(".sidebar [data-page].active")?.dataset
            .page || "home";
        document
          .querySelectorAll(".mobile-bottom-nav [data-page]")
          .forEach((button) => {
            const active = button.dataset.page === selected;
            button.classList.toggle("active", active);
            if (active) button.setAttribute("aria-current", "page");
            else button.removeAttribute("aria-current");
          });
        more.classList.toggle(
          "active",
          ["groups", "progress", "settings"].includes(selected),
        );
      };
      more.addEventListener("click", () => {
        if (!menu.open) menu.showModal();
      });
      document
        .getElementById("closeMobileMenu")
        .addEventListener("click", () => menu.close());
      menu.addEventListener("click", (event) => {
        if (event.target.closest("[data-page]")) menu.close();
        else if (event.target === menu) {
          const rect = menu.getBoundingClientRect();
          if (
            event.clientX < rect.left ||
            event.clientX > rect.right ||
            event.clientY < rect.top ||
            event.clientY > rect.bottom
          )
            menu.close();
        }
      });
      new MutationObserver(sync).observe(
        document.querySelector(".sidebar .menu"),
        { subtree: true, attributes: true, attributeFilter: ["class"] },
      );
      matchMedia("(max-width: 600px)").addEventListener("change", (event) => {
        if (!event.matches && menu.open) menu.close();
      });
      sync();
    })();
  </script>

  <script>
    (() => {
      const levels = {
        "ม.": "ชั้นมัธยมศึกษาปีที่ ", "ป.": "ชั้นประถมศึกษาปีที่ ",
        "ปวช.": "ประกาศนียบัตรวิชาชีพ ชั้นปีที่ ",
      };
      const pattern = /((?:ชั้น)?มัธยมศึกษาปีที่|(?:ชั้น)?ประถมศึกษาปีที่|ประกาศนียบัตรวิชาชีพ\s*ชั้นปีที่|ปวช\.|ป\.|ม\.)\s*(\d+)(?:\/(\d+))?/g;
      let scheduled = false;
      const labels = new Set();
      const resize = new ResizeObserver(() => schedule());
      const observed = new WeakSet();
      function fit(el) {
        el.textContent = el.dataset.fullClass;
        el.style.fontSize = "";
        el.style.whiteSpace = "nowrap";
        const host = el.closest("td,th,h3,.course-class-chip,.class-compare-heading,p,label") || el.parentElement;
        const bounds = host.getBoundingClientRect();
        const style = getComputedStyle(host);
        const available = Math.max(1, bounds.width - parseFloat(style.paddingLeft || 0) - parseFloat(style.paddingRight || 0));
        const width = el.getBoundingClientRect().width;
        const base = parseFloat(getComputedStyle(el).fontSize);
        if (width > available) el.style.fontSize = (base * available / width * 0.98) + "px";
      }
      function scan() {
        scheduled = false;
        observer.disconnect();
        const roots = [document.getElementById("content"), document.getElementById("modal")].filter(Boolean);
        for (const root of roots) {
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          const nodes = [];
          while (walker.nextNode()) {
            const node = walker.currentNode;
            if (node.parentElement.closest("script,style,select,textarea,.responsive-class-name,[contenteditable]")) continue;
            pattern.lastIndex = 0;
            if (pattern.test(node.nodeValue)) nodes.push(node);
          }
          for (const node of nodes) {
            const text = node.nodeValue, fragment = document.createDocumentFragment();
            pattern.lastIndex = 0;
            let at = 0, match;
            while ((match = pattern.exec(text))) {
              fragment.append(document.createTextNode(text.slice(at, match.index)));
              const el = document.createElement("span");
              el.className = "responsive-class-name";
              el.dataset.shortClass = match[1] + match[2] + (match[3] ? "/" + match[3] : "");
              el.dataset.fullClass = (levels[match[1]] || match[1] + " ") + match[2] + (match[3] ? "/" + match[3] : "");
              el.title = el.dataset.fullClass;
              el.setAttribute("aria-label", el.dataset.fullClass);
              fragment.append(el); labels.add(el);
              at = match.index + match[0].length;
            }
            fragment.append(document.createTextNode(text.slice(at))); node.replaceWith(fragment);
          }
        }
        for (const option of document.querySelectorAll("#content select option,#modal select option")) {
          const raw = option.dataset.classOption || option.textContent;
          const m = raw.match(/^(ปวช\.|ป\.|ม\.)\s*(\d+)(?:\/(\d+))?(.*)$/);
          if (!m) continue;
          option.dataset.classOption = raw;
          const desired = levels[m[1]] + m[2] + (m[3] ? "/" + m[3] : "") + m[4];
          if (option.textContent !== desired) option.textContent = desired;
        }
        for (const el of labels) {
          if (!el.isConnected) { labels.delete(el); continue; }
          fit(el);
          const host = el.parentElement;
          if (!observed.has(host)) { observed.add(host); resize.observe(host); }
        }
        for (const root of roots) observer.observe(root, { childList: true, subtree: true, characterData: true });
      }
      function schedule() {
        if (!scheduled) { scheduled = true; requestAnimationFrame(scan); }
      }
      const observer = new MutationObserver(schedule);
      window.addEventListener("resize", schedule);
      scan();
    })();
  </script>
