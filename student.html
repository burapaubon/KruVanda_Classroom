    <title>Student | KruVanda Classroom</title>

    <script>

        (() => {

            let u = {};

            try {

                u = JSON.parse(sessionStorage.getItem("userData") || "{}") || {};

            } catch { }

            if (!u.token || !["teacher", "student"].includes(u.role)) {

                location.replace("index.html");

                return;

            }

            if (u.role === "teacher") location.replace("teacher.html");

        })();

    </script>

    <style id="teacher-design-system">
        :root {
            --orange: #ff8a00;
            --orange-2: #ffb000;
            --gold: #ffd36a;
            --deep: #2d1b0b;
            --brown: #5d3b16;
            --soft: #fff8ea;
            --white: #ffffff;

            --glass-strong: rgba(255, 255, 255, 0.88);
            --border: rgba(255, 255, 255, 0.55);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: "Prompt", "Tahoma", sans-serif;
            color: var(--deep);
            overflow-x: hidden;
            background:
                radial-gradient(circle at 12% 10%,
                    rgba(255, 196, 81, 0.46),
                    transparent 28%),
                radial-gradient(circle at 88% 78%,
                    rgba(255, 138, 0, 0.32),
                    transparent 31%),
                radial-gradient(circle at 50% 50%,
                    rgba(255, 255, 255, 0.95),
                    transparent 42%),
                linear-gradient(135deg, #fffaf0 0%, #ffe8bd 52%, #ffffff 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.32;
            background-image:
                linear-gradient(rgba(255, 138, 0, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 138, 0, 0.055) 1px, transparent 1px);
            background-size: 43.24px 43.24px;
            mask-image: linear-gradient(to bottom, black, transparent 90%);
            z-index: -3;
        }

        body::after {
            content: "";
            position: fixed;
            width: 488.8px;
            height: 488.8px;
            right: -169.2px;
            bottom: -169.2px;
            border-radius: 50%;
            background: radial-gradient(circle,
                    rgba(255, 138, 0, 0.25),
                    rgba(255, 179, 0, 0.12) 45%,
                    transparent 70%);
            filter: blur(11.28px);
            animation: slowSpin 18s linear infinite;
            pointer-events: none;
            z-index: -2;
        }

        @keyframes slowSpin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .tech-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;

        .tech:nth-child(1) {

            left: 28%;
            font-size: 24.44px;
        }

        .tech:nth-child(2) {
            top: 25%;
            right: 8%;
            font-size: 18.8px;
            animation-delay: -3s;
        }

        .tech:nth-child(3) {
            bottom: 18%;
            left: 32%;
            font-size: 22.56px;
            animation-delay: -6s;
        }

        .tech:nth-child(4) {
            bottom: 8%;
            right: 22%;
            font-size: 16.92px;
            animation-delay: -2s;
        }

        .tech:nth-child(5) {
            top: 52%;
            left: 5%;
            font-size: 16.92px;
            animation-delay: -5s;
        }

        @keyframes floatTech {

    <script>

        (() => {

            let user;

            try {

                user = JSON.parse(sessionStorage.getItem("userData") || "{}");

            } catch {

                user = {};

            }

            if (!user.token || !["teacher", "student"].includes(user.role)) {

                location.replace("index.html");

                return;

            }

            let leaving = false,

                pending = false,

                lastSent = 0,

                queued = 0;

            const idleMs = user.role === "student" ? 900000 : 3600000;

            const url = sessionStorage.getItem("kruvandaGasUrl") || "";

            const stateKey = "kruvandaActivity";

            let state;

            try {

                state = JSON.parse(sessionStorage.getItem(stateKey) || "{}");

            } catch {

                state = {};

            }

            let lastActive = state.token === user.token ? Number(state.at) : 0;

            if (!lastActive)

                lastActive =

                    Date.now() -

                    Math.max(

                        0,

                        Number(user.serverNow || 0) +

                        idleMs -

                        Number(user.expiresAt || 0),

                    );

            let deadline = lastActive + idleMs;

            let warning;

            function clearLogin(reason) {

                if (leaving) return;

                leaving = true;

                clearTimeout(queued);

                const token = user.token;

                sessionStorage.removeItem("userData");

                sessionStorage.removeItem(stateKey);

                sessionStorage.removeItem("kruvandaBaseSnapshot");

                sessionStorage.removeItem("kruvandaMutationRequests");

                sessionStorage.setItem(

                    "kruvandaLoginNotice",

                    reason || "เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่",

                );

                if (warning) warning.remove();

                document.documentElement.style.visibility = "hidden";

                if (

                    /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)

                ) {

                    fetch(url, {

                        method: "POST",

                        headers: { "Content-Type": "text/plain;charset=utf-8" },

                        body: JSON.stringify({ action: "logout", token }),

                        keepalive: true,

                    }).catch(() => { });

                }

                location.replace("index.html");

            }

            window.kruvandaSession = { expire: clearLogin };

            if (user.sessionPolicy !== "idle-v1") {

                clearLogin(

                    "ระบบปรับการหมดอายุเมื่อไม่ได้ใช้งาน กรุณาเข้าสู่ระบบใหม่หนึ่งครั้ง",

                );

                return;

            }

            function saveActivity() {

                sessionStorage.setItem(

                    stateKey,

                    JSON.stringify({ token: user.token, at: lastActive }),

                );

            }

            function warningView(remaining) {

                if (!warning) {

                    warning = document.createElement("div");

                    warning.setAttribute("role", "alert");

                    warning.style.cssText =

                        "position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));z-index:100000;background:#fff5e5;color:#603a24;border:1px solid #daa66d;border-radius:16px;padding:18px;box-shadow:0 8px 30px #0002;font:14px/1.6 Tahoma,sans-serif;text-align:center";

                    warning.innerHTML =

                        '<strong>ใกล้หมดเวลาเข้าใช้งาน</strong><p data-idle-count></p><p>หากกำลังกรอกข้อมูล ให้บันทึกก่อนออกจากระบบ</p><button type="button" style="padding:10px 20px;border:0;border-radius:10px;background:#a84d20;color:white;font:inherit">ใช้งานต่อ</button>';

                    warning

                        .querySelector("button")

                        .addEventListener("click", (e) => activity(e, true));

                    document.body.appendChild(warning);

                }

                warning.querySelector("[data-idle-count]").textContent =

                    `ไม่ได้ใช้งานต่อเนื่อง ระบบจะกลับหน้าเข้าสู่ระบบใน ${Math.max(1, Math.ceil(remaining / 1000))} วินาที`;

            }

            function tick() {

                if (leaving) return;

                const remaining =

                    Math.min(deadline, lastActive + idleMs) - Date.now();

                if (remaining <= 0) {

                    clearLogin("ออกจากระบบเพราะไม่มีการใช้งานนาน กรุณาเข้าสู่ระบบใหม่");

                    return;

                }

                if (!document.hidden && remaining <= 60000) warningView(remaining);

            }

            async function request(action) {

                if (

                    leaving ||

                    pending ||

                    !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)

                )

                    return;

                pending = true;

                const controller = new AbortController();

                const timeout = setTimeout(() => controller.abort(), 20000);

                try {

                    const response = await fetch(url, {

                        method: "POST",

                        headers: { "Content-Type": "text/plain;charset=utf-8" },

                        body: JSON.stringify({ action, token: user.token }),

                        signal: controller.signal,

                    });

                    if (!response.ok) return;

                    const result = await response.json();

                    if (result.code === "AUTH_EXPIRED") {

                        clearLogin(result.message);

                        return;

                    }

                    if (result.status !== "success" || !result.data?.expiresAt) return;

                    deadline =

                        Date.now() +

                        Math.max(

                            0,

                            Number(result.data.expiresAt) - Number(result.data.serverNow),

                        );

                    user.expiresAt = result.data.expiresAt;

                    user.serverNow = result.data.serverNow;

                    if (!leaving) {

                        let current = {};

                        try {

                            current = JSON.parse(

                                sessionStorage.getItem("userData") || "{}",

                            );

                        } catch (_) { }

                        if (current.token === user.token)

                            sessionStorage.setItem(

                                "userData",

                                JSON.stringify({

                                    ...current,

                                    expiresAt: user.expiresAt,

                                    serverNow: user.serverNow,

                                }),

                            );

                    }

                } catch (_) {

                } finally {

                    clearTimeout(timeout);

                    pending = false;

                    tick();

                }

            }

            function sendActivity() {

                queued = 0;

                if (leaving || document.hidden || Date.now() - lastActive >= idleMs)

                    return;

                if (pending) {

                    queued = setTimeout(sendActivity, 1000);

                    return;

                }

                lastSent = Date.now();

                request("sessionTouch");

            }

            function activity(event, immediate = false) {

                if (!event.isTrusted || leaving || document.hidden) return;

                if (Date.now() >= Math.min(deadline, lastActive + idleMs)) {

                    tick();

                    return;

                }

                lastActive = Date.now();

                saveActivity();

                if (warning) {

                    warning.remove();

                    warning = null;

                }

                if (immediate || Date.now() - lastSent >= 60000) {

                    clearTimeout(queued);

                    sendActivity();

                } else if (!queued)

                    queued = setTimeout(sendActivity, 60000 - (Date.now() - lastSent));

            }

            ["pointerdown", "keydown", "input", "wheel", "touchmove"].forEach(

                (name) =>

                    document.addEventListener(name, activity, {

                        capture: true,

                        passive: true,

                    }),

            );

            document.addEventListener("visibilitychange", () => {

                tick();

                if (!document.hidden && !leaving) request("sessionCheck");

            });

            window.addEventListener("pageshow", () => {

                tick();

            });

            saveActivity();

            tick();

            setInterval(tick, 1000);

        })();

        (() => {

            let pending = false,

                lastAt = 0;

            async function heartbeat() {

                if (pending || document.hidden || Date.now() - lastAt < 45000) return;

                let u;

                try {

                    u = JSON.parse(sessionStorage.getItem("userData") || "{}");

                } catch {

                    return;

                }

                const url = sessionStorage.getItem("kruvandaGasUrl") || "";

                if (

                    !u.token ||

                    u.role !== "student" ||

                    !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)

                )

                    return;

                pending = true;

                lastAt = Date.now();

                const controller = new AbortController(),

                    timer = setTimeout(() => controller.abort(), 20000);

                try {

                    const response = await fetch(url, {

                        method: "POST",

                        headers: { "Content-Type": "text/plain;charset=utf-8" },

                        body: JSON.stringify({

                            action: "presenceHeartbeat",

                            token: u.token,

                        }),

                        signal: controller.signal,

                    });

                    if (!response.ok) return;

                    const result = await response.json();

                    if (result.code === "AUTH_EXPIRED")

                        window.kruvandaSession?.expire(result.message);

                } catch {

                } finally {

                    clearTimeout(timer);

                    pending = false;

                }

            }

            document.addEventListener("visibilitychange", () => {

                if (!document.hidden) heartbeat();

            });

            heartbeat();

            setInterval(heartbeat, 60000);

        })();

        let currentUser = {};

        try {

            currentUser =

                JSON.parse(sessionStorage.getItem("userData") || "{}") || {};

        } catch { }

        document.getElementById("studentName").textContent =

            currentUser.fullName || "";



    </script>

    <div id="toast" hidden role="status" aria-live="polite"></div>

    <script>(() => {

            const content = document.getElementById('content'), esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

            let offerings = [], selected = '', data = null, current = null, saving = false, timer = null;

            const user = JSON.parse(sessionStorage.getItem('userData') || '{}');

            function paintNoticeToast(target, message) { const success = !/ไม่สำเร็จ|ไม่สามารถ|ผิดพลาด/.test(message) && /สำเร็จ|เรียบร้อย|ส่งคำตอบแล้ว/.test(message); target.dataset.kind = success ? 'success' : 'notice'; target.replaceChildren(); if (success) { const icon = document.createElement('span'); icon.className = 'notice-success-icon'; icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 12 4 4 8-8"/></svg>'; const copy = document.createElement('span'); copy.className = 'notice-success-copy'; const title = document.createElement('strong'); title.textContent = 'เรียบร้อยแล้ว'; const text = document.createElement('span'); text.textContent = message; copy.append(title, text); target.append(icon, copy) } else target.textContent = message; }
            let studentToastTimer; function toast(message) { const t = document.getElementById('toast'); paintNoticeToast(t, message); t.hidden = false; clearTimeout(studentToastTimer); studentToastTimer = setTimeout(() => t.hidden = true, 5000); }

            async function apiRequest(action, fields = {}) { const url = sessionStorage.getItem('kruvandaGasUrl'); if (!url) throw Error('กรุณาเข้าสู่ระบบใหม่เพื่อเชื่อมต่อบทเรียน'); const ctrl = new AbortController(), timeout = setTimeout(() => ctrl.abort(), 90000); try { const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...fields, token: user.token }), signal: ctrl.signal }); const r = await res.json(); if (r.status !== 'success') { if (r.code === 'AUTH_EXPIRED') window.kruvandaSession?.expire(r.message); throw Error(r.message || 'ดำเนินการไม่สำเร็จ'); } return r.data; } finally { clearTimeout(timeout); } }

            const pendingStudentReads = new Map();
            function api(action, fields = {}) { if (!['studentHome', 'studentCourse', 'readMaterial', 'submission', 'submissionHistory', 'activityResult'].includes(action)) return apiRequest(action, fields); const key = JSON.stringify([user.token, action, fields]); if (pendingStudentReads.has(key)) return pendingStudentReads.get(key); const request = apiRequest(action, fields).finally(() => { if (pendingStudentReads.get(key) === request) pendingStudentReads.delete(key) }); pendingStudentReads.set(key, request); return request }
            function popup(title, html) { const d = document.getElementById('modal'); d.classList.remove('account-dialog'); document.getElementById('modalTitle').textContent = title; document.getElementById('modalBody').innerHTML = html; if (!d.open) d.showModal(); }

            let confirmationPending = false;
            function confirmStudent(message) {
                if (confirmationPending) return Promise.resolve(false);
                confirmationPending = true;
                const focus = document.activeElement;
                return new Promise(resolve => {
                    const d = document.createElement('dialog'); d.className = 'system-confirm-dialog'; d.setAttribute('aria-labelledby', 'studentConfirmTitle'); d.setAttribute('aria-describedby', 'studentConfirmText');
                    d.innerHTML = `<h2 id="studentConfirmTitle">ยืนยันการดำเนินการ</h2><p id="studentConfirmText">${esc(message)}</p><div class="system-confirm-actions"><button type="button" data-result="no" autofocus>ยกเลิก</button><button type="button" data-result="yes" class="btn primary">ยืนยัน</button></div>`;
                    document.body.appendChild(d); let settled = false;
                    const finish = v => { if (settled) return; settled = true; d.close(); d.remove(); confirmationPending = false; if (focus?.isConnected) focus.focus(); resolve(v) };
                    d.onclick = e => { const b = e.target.closest('[data-result]'); if (b) finish(b.dataset.result === 'yes') }; d.oncancel = e => { e.preventDefault(); finish(false) }; d.showModal();
                });
            }

            function shortcutIcon(action) {
                const paths = {
                    "metric-tasks":
                        '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
                    "metric-sent": '<path d="M12 3v12M8 7l4-4 4 4M4 14v6h16v-6"/>',
                    "metric-clock":
                        '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
                    "metric-check":
                        '<circle cx="12" cy="12" r="9"/><path d="M7 12l3 3 7-7"/>',
                    "metric-return": '<path d="M9 5L4 10l5 5M4 10h10a6 6 0 0 1 0 12"/>',
                    "metric-missing":
                        '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 9l6 6M15 9l-6 6"/>',
                    "metric-rate":
                        '<circle cx="7" cy="7" r="3"/><circle cx="17" cy="17" r="3"/><path d="M5 19L19 5"/>',

                    "go-courses":
                        '<path d="M12 5v15M3 4c4-1 6 0 9 2 3-2 5-3 9-2v14c-4-1-6 0-9 2-3-2-5-3-9-2z"/>',
                    "go-students":
                        '<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5"/>',
                    "go-groups":
                        '<path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6M9 10h.01M15 10h.01"/>',
                    "home-review":
                        '<rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 3h6v4H9zM9 13l2 2 4-4"/>',
                    "go-progress": '<path d="M4 4v16h16M8 15l4-5 4 2 4-7"/>',
                    "my-profile":

                try { await api('changePassword', { oldPassword: f.elements.oldPassword.value, newPassword: f.elements.newPassword.value, requestId: crypto.randomUUID() }); window.kruvandaSession?.expire('เปลี่ยนรหัสผ่านแล้ว กรุณาเข้าสู่ระบบใหม่'); }
                finally { saving = false; b.disabled = false; }
            }


            function updateFocus() {
                const modal = document.getElementById('modal'), body = document.getElementById('modalBody');
                const enabled = !!current?.activity.protectContent;
                modal.classList.toggle('focus-mode', enabled);
                let gate = document.getElementById('focusGate');
                if (!gate) { gate = document.createElement('div'); gate.id = 'focusGate'; gate.hidden = true; modal.appendChild(gate) }
                const paused = enabled && !document.fullscreenElement && !current.focusFallback;
                modal.classList.toggle('focus-paused', paused); body.inert = paused; gate.hidden = !paused;
                if (paused) {
                    const supported = !!document.documentElement.requestFullscreen && document.fullscreenEnabled !== false;
                    gate.innerHTML = `<div class="focus-message"><h2>โหมดโฟกัสการทำกิจกรรม</h2><p>${supported ? 'กรุณาเข้าเต็มหน้าจอเพื่อทำกิจกรรมต่อ' : 'อุปกรณ์นี้ไม่รองรับการเข้าเต็มหน้าจอ จะใช้หน้ากิจกรรมเต็มพื้นที่แทน'}</p><p>ไม่อนุญาตให้คลุมดำหรือคัดลอกโจทย์และตัวเลือก</p>${current.expiresAt ? '<p>เวลายังคงเดินต่อ</p>' : ''}<button type="button" class="btn primary" id="resumeFocus">กลับไปทำต่อ</button><button type="button" class="btn" id="leaveFocus">ปิดกิจกรรม</button><p id="focusError" role="alert"></p></div>`;
                    gate.querySelector('#resumeFocus').onclick = async () => { try { if (supported) { await document.documentElement.requestFullscreen(); if (current) current.focusOwned = true } else if (current) current.focusFallback = true; updateFocus() } catch (e) { document.getElementById('focusError').textContent = 'เข้าเต็มหน้าจอไม่สำเร็จ กรุณาลองอีกครั้ง หรือใช้เบราว์เซอร์ที่รองรับ' } };
                    gate.querySelector('#leaveFocus').onclick = () => close();
                }
            }
            function endFocus() { const modal = document.getElementById('modal'); modal.classList.remove('focus-mode', 'focus-paused'); document.getElementById('modalBody').inert = false; const gate = document.getElementById('focusGate'); if (gate) gate.hidden = true; if (document.fullscreenElement) document.exitFullscreen().catch(() => { }) }
            document.addEventListener('fullscreenchange', updateFocus);

            let lastProtectionWarning = 0;
            function protectedQuestion(target) { return current?.activity.protectContent && target instanceof Element && target.closest('#studentActivityForm.protected-activity .question-row') && !target.closest('textarea,input:not([type=radio]):not([type=checkbox]),select') }
            let protectedPointer = null; document.addEventListener('pointerdown', e => { protectedPointer = protectedQuestion(e.target) ? { x: e.clientX, y: e.clientY } : null }); document.addEventListener('pointermove', e => { if (protectedPointer && e.buttons === 1 && Math.hypot(e.clientX - protectedPointer.x, e.clientY - protectedPointer.y) > 8) { warnProtection(); protectedPointer = null } }); document.addEventListener('pointerup', () => protectedPointer = null);
            function warnProtection() { if (Date.now() - lastProtectionWarning > 1500) { lastProtectionWarning = Date.now(); toast('ไม่อนุญาตให้เลือกหรือคัดลอกโจทย์และตัวเลือก') } }
            ['selectstart', 'copy', 'cut', 'contextmenu', 'dragstart'].forEach(type => document.addEventListener(type, e => { if (protectedQuestion(e.target)) { e.preventDefault(); window.getSelection()?.removeAllRanges(); warnProtection() } }, true));
            document.addEventListener('keydown', e => { if (!current?.activity.protectContent || !(e.target instanceof Element)) return; const key = e.key.toLowerCase(); if (e.key === 'PrintScreen' || ((e.ctrlKey || e.metaKey) && key === 'p') || ((e.ctrlKey || e.metaKey) && ['a', 'c', 'x'].includes(key) && !e.target.closest('textarea,input:not([type=radio]):not([type=checkbox]),select'))) { e.preventDefault(); warnProtection() } }, true);

            function showError(e) { const t = document.getElementById('studentAnswerError'); if (t) t.textContent = e.message; toast(e.name === 'AbortError' ? 'รอข้อมูลนานเกินไป กรุณาลองอีกครั้ง' : e.message); }

            document.addEventListener('click', async e => { const b = e.target.closest('button'); if (!b) return; if (saving && b.id !== 'studentLogout' && b.dataset.studentAction !== 'logout') { toast('กำลังส่งคำตอบ กรุณารอสักครู่'); return } try { if (b.dataset.studentPage) { if (current) { await close(); if (current) return; } ++loadVersion; content.removeAttribute('aria-busy'); studentPage = b.dataset.studentPage; render(); } else if (b.dataset.studentAction === 'refresh-course') { if (selected) await load(selected, true); else { offerings = await api('studentHome'); render(); } } else if (b.dataset.studentAction === 'logout') document.getElementById('studentLogout').click(); else if (b.dataset.studentAction === 'account') account(); else if (b.dataset.studentAction === 'password') passwordForm(); else if (b.dataset.course) await load(b.dataset.course); else if (b.dataset.open) b.dataset.type === 'material' ? await openMaterial(b.dataset.open) : await openActivity(b.dataset.open); else if (b.dataset.worksheetPdf) printWorksheet(b.dataset.worksheetPdf); else if (b.dataset.download) await downloadWork(b.dataset.download, b.dataset.fileId || ""); else if (b.dataset.result && b.dataset.result !== 'yes' && b.dataset.result !== 'no') await result(b.dataset.result); else if (b.dataset.game) { collect(); if (b.dataset.game === 'prev') { current.index--; drawActivity(); } else { if (!complete(current.questions[current.index], current.index)) throw Error('กรุณาตอบข้อนี้ให้ครบก่อน'); if (current.index === current.questions.length - 1) await submit(); else { current.index++; drawActivity(); } } } } catch (error) { showError(error) } });

            document.addEventListener('input', e => { if (current && e.target.closest('#studentActivityForm')) collect() }); document.addEventListener('change', e => { if (e.target.id === 'worksheetSubmissionFile') { document.getElementById('studentAnswerError').textContent = ''; document.getElementById('toast').hidden = true; document.getElementById('studentSelectedFiles').innerHTML = [...e.target.files].map(f => `<p>${esc(f.name)} · ${(f.size / 1024 / 1024).toFixed(2)} MB</p>`).join('') } if (current && e.target.closest('#studentActivityForm')) collect() });

            document.addEventListener('submit', async e => { if (e.target.id === 'studentPasswordForm') { e.preventDefault(); try { await savePassword(e.target); } catch (error) { showError(error); } return; } if (e.target.id !== 'studentActivityForm') return; e.preventDefault(); try { await submit() } catch (error) { showError(error) } });

            async function close() { if (saving) { toast('กำลังส่งคำตอบ กรุณารอสักครู่'); return; } if (current && !(await confirmStudent('ปิดกิจกรรมนี้หรือไม่? คำตอบพิมพ์จะเก็บไว้ในแท็บนี้ ไฟล์ที่เลือกแต่ยังไม่ส่งต้องเลือกใหม่ และกิจกรรมที่จับเวลายังนับต่อ'))) return; if (current) collect(); current = null; endFocus(); clearInterval(timer); document.getElementById('modal').close(); }

            document.getElementById('studentLogout').onclick = () => { if (window.kruvandaSession) return window.kruvandaSession.expire('ออกจากระบบแล้ว กรุณาเข้าสู่ระบบใหม่'); sessionStorage.removeItem('userData'); location.replace('index.html'); }; document.getElementById('closeModal').onclick = close; document.getElementById('modal').addEventListener('cancel', e => { e.preventDefault(); close() });

            document.getElementById('brandReload').onclick = () => location.reload();
            (async () => { try { offerings = await api('studentHome'); render(); } catch (e) { content.innerHTML = '<p>โหลดบทเรียนไม่สำเร็จ</p><button id="retryStudent">ลองอีกครั้ง</button>'; document.getElementById('retryStudent').onclick = () => location.reload(); showError(e) } })();

        })();

    </script>

    <script>
        (() => {
            let heading;
            const fitWelcome = () => {
                const next = document.querySelector(".welcome-hero h2");
                if (!next || !next.clientWidth) return;
                if (heading !== next) {
                    if (heading) resize.unobserve(heading);
                    heading = next;
                    resize.observe(heading);
                }
                heading.style.removeProperty("font-size");
                if (matchMedia("(max-width: 700px)").matches) return;
                const base = parseFloat(getComputedStyle(heading).fontSize);
                if (heading.scrollWidth > heading.clientWidth) {
                    const size = Math.max(
                        10,
                        Math.floor(
                            ((base * heading.clientWidth) / heading.scrollWidth) * 10,
                        ) / 10,
                    );
                    heading.style.fontSize = size + "px";
                }
            };
            const resize = new ResizeObserver(fitWelcome);
            const content = document.getElementById("content");
            if (content)
                new MutationObserver(fitWelcome).observe(content, {
                    childList: true,
                    subtree: true,
                    characterData: true,
                });
            window.addEventListener("resize", fitWelcome);
            document.fonts.ready.then(fitWelcome);
            fitWelcome();
        })();
    </script>
    <script>
        (() => { let pending = false; const selector = '.fit-line,#modalTitle,.system-confirm-dialog h2,.system-confirm-dialog p,.system-confirm-actions button,.actions button,.resource-row strong,.course-card h3,.chapter-summary-text h3,.student-name-cell strong,.student-table th,.student-table td:not(:has(*)),.access-badge,.student-course-tag,.workspace-summary>div>span:not(.stat-symbol),.workspace-summary>div>p'; function fit() { pending = false; const nodes = [...document.querySelectorAll(selector)].filter(el => !(el.matches('.system-confirm-dialog p') && el.textContent.length > 120)); nodes.forEach(el => { el.style.fontSize = ''; el.style.whiteSpace = 'nowrap'; if (!el.hasAttribute('title') && el.textContent.trim()) el.title = el.textContent.trim() }); const sizes = nodes.map(el => { const width = el.clientWidth; if (!width) return null; const base = parseFloat(getComputedStyle(el).fontSize), scroll = el.scrollWidth; return scroll > width ? Math.max(el.closest('.activity-option-card') ? 10 : el.matches('.system-confirm-dialog p') ? 9 : 11, base * width / scroll - .3) : null }); nodes.forEach((el, i) => { if (sizes[i] !== null) el.style.fontSize = sizes[i] + 'px' }) } function queue() { if (!pending) { pending = true; requestAnimationFrame(fit) } } new MutationObserver(queue).observe(document.body, { childList: true, subtree: true, characterData: true }); window.addEventListener('resize', queue); document.fonts?.ready.then(queue); queue() })();
    </script>
